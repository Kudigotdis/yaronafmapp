<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Mobile viewport configuration -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Events 2026</title>
  
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      /* Main background requested */
      background-color: #f4f4f4; 
      display: flex;
      justify-content: center;
    }

    /* Mobile App Container Simulation */
    .app-container {
      width: 100%;
      max-width: 480px; /* Constrains to mobile dimensions on desktop */
      min-height: 100vh;
      background-color: #f4f4f4;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* App Header */
    .app-header {
      background-color: #ffffff;
      padding: 20px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(128, 128, 128, 0.1);
    }
    .app-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
    }
    .app-header p {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
    }

    /* Events Wrapper */
    .events-wrapper {
      padding: 16px 12px;
      padding-bottom: 40px;
    }

    /* Accordion Styles */
    .accordion {
      /* White accordions requested */
      background-color: #ffffff;
      /* Light grey with 20% opacity border */
      border: 1px solid rgba(128, 128, 128, 0.2); 
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .accordion-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .accordion-month {
      font-size: 16px;
      font-weight: 600;
      color: #333333;
      text-transform: capitalize;
    }

    .accordion-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .accordion-count {
      font-size: 13px;
      color: #777777;
      background: #f4f4f4;
      padding: 4px 8px;
      border-radius: 20px;
      font-weight: 500;
    }

    .chevron {
      width: 12px;
      height: 12px;
      border-right: 2px solid #aaaaaa;
      border-bottom: 2px solid #aaaaaa;
      transform: rotate(45deg);
      transition: transform 0.3s ease;
    }
    
    .accordion.active .chevron {
      transform: rotate(-135deg);
    }

    .accordion-body {
      display: none;
      padding: 0;
      border-top: 1px solid rgba(128, 128, 128, 0.1);
    }
    
    .accordion.active .accordion-body {
      display: block;
    }

    /* Event Row Styles */
    .event-row {
      padding: 16px;
      border-bottom: 1px solid rgba(128, 128, 128, 0.1);
    }
    .event-row:last-child {
      border-bottom: none;
    }

    .event-name {
      font-size: 15px;
      font-weight: 600;
      color: #222222;
      margin-bottom: 6px;
    }

    .event-desc {
      font-size: 13px;
      color: #666666;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .event-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .event-date {
      font-size: 12px;
      font-weight: 600;
      color: #e55a39; /* Brand accent color */
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .event-cat-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .event-cat {
      font-size: 10px;
      color: #555555;
      background-color: #f4f4f4;
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: capitalize;
    }

  </style>
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <h1>Botswana Events 2026</h1>
      <p>Unified events database</p>
    </header>

    <main class="events-wrapper" id="events-wrapper">
      <!-- Events will be injected here by JavaScript -->
    </main>
  </div>

  <script>
    // Embedded JSON Data
    const BOTSWANA_EVENTS_2026 = {
      "database_meta": {
        "version": "1.1",
        "name": "Merged Botswana 2026 Events",
        "description": "Unified events database with duplicates removed",
        "last_updated": "2026-02-25T01:30:00Z"
      },
      "events_by_month": {
        "january": {"events": [{"event_id": "BW-2026-JAN-001", "event_name": "December Summer Cup", "categories": ["sports_horse_racing", "sports_other"], "start_date": "2026-01-01", "description": "Annual horse racing event to welcome the new year"}, {"event_id": "BW-2026-JAN-002", "event_name": "The Day Club", "categories": ["lifestyle_entertainment"], "start_date": "2026-01-01", "description": "New Year's Day club event at UB"}, {"event_id": "MAS-KC-2026", "event_name": "Mascom Kickoff Cup", "categories": ["sports_soccer", "community_charity", "youth_development"], "start_date": "2026-01-10", "description": "Kicking Off the New Year with Connectivity"}]},
        "february": {"events": [{"event_id": "BW-2026-FEB-001", "event_name": "Unscripted Vision Board Affair", "categories": ["lifestyle_entertainment", "business_expo"], "start_date": "2026-02-02", "description": "Vision board creation workshop and networking event"}, {"event_id": "FNB-CSF-2026", "event_name": "FNB Community Shield Festival", "categories": ["sports_soccer", "community_charity", "youth_development"], "start_date": "2026-02-07", "description": "Banking on Community Football"}, {"event_id": "ORG-DWC-2026", "event_name": "Orange Digital Warriors Cup", "categories": ["sports_soccer", "youth_development"], "start_date": "2026-02-14", "description": "Connect. Compete. Conquer."}, {"event_id": "BW-2026-FEB-002", "event_name": "Senkgamorodi Cycle Classic", "categories": ["sports_cycling"], "start_date": "2026-02-21", "description": "Two-day cycling classic through Bobonong"}, {"event_id": "BW-2026-FEB-003", "event_name": "FNB Kazungula Marathon", "categories": ["sports_athletics", "community_charity"], "start_date": "2026-02-28", "description": "FNB-sponsored marathon in Kasane"}, {"event_id": "BW-2026-FEB-004", "event_name": "Letsekela Music and Arts Festival", "categories": ["music_festival", "arts_culture"], "start_date": "2026-02-28", "description": "Music and arts celebration in Otse Village"}]},
        "march": {"events": [{"event_id": "BW-2026-MAR-001", "event_name": "Herero Mbanderu Annual Cultural Festival", "categories": ["arts_culture", "national_events"], "start_date": "2026-03-06", "description": "Annual celebration of Herero and Mbanderu culture"}, {"event_id": "BW-2026-MAR-002", "event_name": "Francistown Motorshow", "categories": ["lifestyle_entertainment", "business_expo"], "start_date": "2026-03-06", "description": "Two-day automotive exhibition and motorshow"}, {"event_id": "CHO-VKT-2026", "event_name": "Choppies Village Kitchen Tournament", "categories": ["sports_soccer", "community_charity", "gastronomy_agrotourism"], "start_date": "2026-03-07", "description": "Feeding Dreams, Building Communities"}, {"event_id": "BW-2026-MAR-006", "event_name": "Gabs Half Marathon 2026", "categories": ["sports_athletics", "national_events"], "start_date": "2026-03-15", "description": "Gaborone's annual half marathon event"}, {"event_id": "BW-2026-MAR-011", "event_name": "Black And White Party", "categories": ["lifestyle_entertainment"], "start_date": "2026-03-28", "description": "Black and white themed party at Cresta Thapama"}]},
        "april": {"events": [{"event_id": "BW-2026-APR-001", "event_name": "Easter Eve Bash", "categories": ["lifestyle_entertainment"], "start_date": "2026-04-02", "description": "Easter weekend celebration event"}, {"event_id": "DEB-DC-2026", "event_name": "Debswana Diamond Cup", "categories": ["sports_soccer", "community_charity"], "start_date": "2026-04-04"}, {"event_id": "BW-2026-APR-016", "event_name": "Tropic of Capricorn International Marathon", "categories": ["sports_athletics", "national_events"], "start_date": "2026-04-25", "description": "International marathon along the Tropic of Capricorn"}, {"event_id": "BW-2026-APR-019", "event_name": "Gaborone Golden Grand Prix", "categories": ["sports_athletics", "national_events"], "start_date": "2026-04-26", "description": "Premier athletics grand prix event in Gaborone"}]},
        "may": {"events": [{"event_id": "KAL-DC-2026", "event_name": "Kgalagadi Desert Challenge", "categories": ["sports_soccer", "community_charity"], "start_date": "2026-04-18"}, {"event_id": "GUA-SH-U16-2026", "event_name": "Guardian Shield U16", "categories": ["sports_soccer", "youth_development"], "start_date": "2026-05-02"}, {"event_id": "FNB-SSF-2026", "event_name": "FNB School Sports Festival", "categories": ["sports_soccer", "youth_development", "community_charity"], "start_date": "2026-05-15"}]},
        "june": {"events": [{"event_id": "PRES-CC-2026", "event_name": "President's Charity Cup", "categories": ["sports_soccer", "community_charity", "national_events"], "start_date": "2026-06-06"}, {"event_id": "MAS-TOP8-2026", "event_name": "Mascom Top 8 Challenge", "categories": ["sports_soccer"], "start_date": "2026-06-13"}]},
        "july": {"events": [{"event_id": "ORG-FS-U13-2026", "event_name": "Orange Future Stars U13", "categories": ["sports_soccer", "youth_development"], "start_date": "2026-07-04"}, {"event_id": "BFL-RZQ-2026", "event_name": "BFL Regional Zone Qualifiers", "categories": ["sports_soccer", "national_events"], "start_date": "2026-07-18"}]},
        "august": {"events": [{"event_id": "IND-CUP-2026", "event_name": "Independence Cup", "categories": ["sports_soccer", "national_events"], "start_date": "2026-08-01"}, {"event_id": "CHO-FRT-2026", "event_name": "Choppies Food Relief Tournament", "categories": ["sports_soccer", "community_charity", "gastronomy_agrotourism"], "start_date": "2026-08-15"}]},
        "september": {"events": [{"event_id": "BSB-CUP-2026", "event_name": "Botswana Savings Bank Cup", "categories": ["sports_soccer", "community_charity"], "start_date": "2026-09-05"}, {"event_id": "MAS-WC-2026", "event_name": "Mascom Wireless Challenge", "categories": ["sports_soccer"], "start_date": "2026-09-12"}]},
        "october": {"events": [{"event_id": "ORG-MCS-2026", "event_name": "Orange Money Charity Shield", "categories": ["sports_soccer", "community_charity"], "start_date": "2026-10-03"}, {"event_id": "FNB-CSL-2026", "event_name": "FNB Corporate Social League", "categories": ["sports_soccer", "business_expo", "community_charity"], "start_date": "2026-10-10"}]},
        "november": {"events": [{"event_id": "BTC-ESC-2026", "event_name": "BTC End of Season Classic", "categories": ["sports_soccer", "national_events"], "start_date": "2026-11-07"}]},
        "december": {"events": [{"event_id": "CHO-CC-2026", "event_name": "Choppies Christmas Cracker", "categories": ["sports_soccer", "community_charity"], "start_date": "2026-12-05"}, {"event_id": "MIZ-NCL-2026", "event_name": "Mizano National Champions League", "categories": ["sports_soccer", "national_events", "youth_development"], "start_date": "2026-12-27"}]}
      }
    };

    // Date formatting helper: "2026-01-10" -> "Saturday 10"
    function formatEventDate(dateString) {
      if (!dateString) return "";
      // Ensure we parse correctly without timezone shifting
      const parts = dateString.split('-');
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      const weekday = d.toLocaleDateString('en-US', { weekday: 'long' });
      const day = d.getDate();
      return `${weekday} ${day}`;
    }

    // Category formatting helper: "sports_horse_racing" -> "Sports Horse Racing"
    function formatCategory(cat) {
      return cat.split('_').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
    }

    const wrapper = document.getElementById('events-wrapper');
    const monthsData = BOTSWANA_EVENTS_2026.events_by_month;

    // Build the UI dynamically
    let htmlContent = '';
    
    // Auto-open the first month as an example
    let isFirst = true;

    for (const [monthName, monthData] of Object.entries(monthsData)) {
      const events = monthData.events;
      if (!events || events.length === 0) continue;

      const activeClass = isFirst ? 'active' : '';

      htmlContent += `
        <div class="accordion ${activeClass}" onclick="this.classList.toggle('active')">
          <div class="accordion-header">
            <span class="accordion-month">${monthName}</span>
            <div class="accordion-meta">
              <span class="accordion-count">${events.length} event${events.length > 1 ? 's' : ''}</span>
              <div class="chevron"></div>
            </div>
          </div>
          <div class="accordion-body">
      `;

      events.forEach(event => {
        const formattedDate = formatEventDate(event.start_date);
        const descriptionHtml = event.description ? `<div class="event-desc">${event.description}</div>` : '';
        
        let catsHtml = '';
        if (event.categories && event.categories.length > 0) {
          catsHtml = event.categories.map(cat => `<span class="event-cat">${formatCategory(cat)}</span>`).join('');
        }

        htmlContent += `
            <div class="event-row">
              <div class="event-name">${event.event_name}</div>
              ${descriptionHtml}
              <div class="event-footer">
                <span class="event-date">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                  ${formattedDate}
                </span>
                <div class="event-cat-container">
                  ${catsHtml}
                </div>
              </div>
            </div>
        `;
      });

      htmlContent += `
          </div>
        </div>
      `;
      
      isFirst = false;
    }

    // Inject into DOM
    wrapper.innerHTML = htmlContent;
  </script>
</body>
</html>
