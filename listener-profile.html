<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yarona FM - Create Listener Profile</title>
  <style>
    :root {
      --brand-red: #C41E3A;
      --brand-black: #000000;
      --brand-white: #FFFFFF;
      --grey-light: #E5E5E5;
      --grey-dark: #666666;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--brand-white);
      color: var(--brand-black);
      min-height: 100vh;
    }
    
    /* Header */
    .header {
      background: var(--brand-white);
      padding: 15px 20px;
      border-bottom: 1px solid var(--grey-light);
      display: flex;
      align-items: center;
      gap: 15px;
    }
    
    .header img {
      height: 30px;
    }
    
    .header-title {
      font-size: 18px;
      font-weight: bold;
    }
    
    /* Form */
    .form {
      padding: 20px;
    }
    
    .page {
      display: none;
    }
    
    .page.active {
      display: block;
    }
    
    /* Accordion */
    .accordion {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      background: var(--brand-white);
      border: 1px solid var(--grey-light);
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .accordion:after {
      content: '+';
      font-size: 20px;
      color: var(--grey-dark);
    }
    
    .accordion.active:after {
      content: '-';
    }
    
    .panel {
      display: none;
      padding: 15px;
      background: var(--brand-white);
      border: 1px solid var(--grey-light);
      border-top: none;
      border-radius: 0 0 8px 8px;
      margin-bottom: 15px;
    }
    
    .panel.open {
      display: block;
    }
    
    /* Form Input */
    .form-input, .form-select {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      border: 1px solid var(--grey-light);
      border-radius: 8px;
      background: var(--brand-white);
      margin-bottom: 12px;
      color: var(--grey-dark);
    }
    
    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: var(--brand-red);
      color: var(--brand-black);
    }
    
    .form-input::placeholder {
      color: var(--grey-dark);
      text-align: center;
    }
    
    /* Profile Picture */
    .profile-pic-container {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .profile-pic {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--grey-light);
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .profile-pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .profile-pic-placeholder {
      font-size: 40px;
      color: var(--grey-dark);
    }
    
    .upload-btn {
      font-size: 14px;
      color: var(--brand-red);
      cursor: pointer;
    }
    
    /* Divider */
    .divider {
      height: 1px;
      background: var(--grey-light);
      margin: 15px 0;
    }
    
    /* Age Display */
    .age-display {
      font-size: 14px;
      color: var(--brand-red);
      text-align: center;
      margin-top: -5px;
      margin-bottom: 10px;
    }
    
    /* Buttons */
    .btn {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      margin-top: 10px;
    }
    
    .btn-primary {
      background: var(--brand-red);
      color: var(--brand-white);
    }
    
    .btn-secondary {
      background: var(--brand-white);
      color: var(--brand-black);
      border: 2px solid var(--brand-black);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <img src="Assets/logo/yarona-logo.svg" alt="Yarona FM">
    <div class="header-title">Create Listener Profile</div>
  </div>
  
  <!-- Form -->
  <form id="listener-form" class="form" onsubmit="handleSubmit(event)">
    <!-- Page 1: Identity -->
    <div class="page active" id="page1">
      <!-- Identity Accordion -->
      <button type="button" class="accordion active" onclick="toggleAccordion(this)">Identity</button>
      <div class="panel open">
        <div class="profile-pic-container">
          <div class="profile-pic" id="profile-pic-display">
            <span class="profile-pic-placeholder">📷</span>
          </div>
          <label class="upload-btn">
            Add Photo
            <input type="file" id="profile-pic" accept="image/*" style="display:none" onchange="handlePicUpload(this)">
          </label>
        </div>
        
        <input type="text" class="form-input" id="firstname" placeholder="Firstname" required>
        <input type="text" class="form-input" id="secondname" placeholder="Second Name">
        <input type="text" class="form-input" id="surname" placeholder="Surname" required>
        <input type="date" class="form-input" id="dob" placeholder="Date of Birth" onchange="calculateAge()" required>
        <div class="age-display" id="age-display"></div>
        <select class="form-select" id="gender" required>
          <option value="">Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
        <input type="text" class="form-input" id="race" placeholder="Race">
        
        <button type="button" class="btn btn-secondary" onclick="nextPage()">Next</button>
      </div>
    </div>
    
    <!-- Page 2: Contact & Location -->
    <div class="page" id="page2">
      <!-- Contact & Location Accordion -->
      <button type="button" class="accordion active" onclick="toggleAccordion(this)">Contact & Location</button>
      <div class="panel open">
        <input type="tel" class="form-input" id="mobile" placeholder="Mobile Number" required>
        <input type="tel" class="form-input" id="mobile-banking" placeholder="Mobile Banking Number">
        <input type="tel" class="form-input" id="whatsapp" placeholder="WhatsApp Number">
        
        <div class="divider"></div>
        
        <select class="form-select" id="city" required onchange="loadAreas()">
          <option value="">Village / Town / City</option>
          <option value="Gaborone">Gaborone</option>
          <option value="Francistown">Francistown</option>
          <option value="Lobatse">Lobatse</option>
          <option value="Maun">Maun</option>
          <option value="Serowe">Serowe</option>
          <option value="Selibe Phikwe">Selibe Phikwe</option>
          <option value="Palapye">Palapye</option>
          <option value="Molepolole">Molepolole</option>
          <option value="Kanye">Kanye</option>
          <option value="Mogoditshane">Mogoditshane</option>
        </select>
        
        <select class="form-select" id="area">
          <option value="">Area / Neighbourhood</option>
        </select>
        
        <button type="submit" class="btn btn-primary">Create Profile</button>
        <button type="button" class="btn btn-secondary" onclick="prevPage()">Back</button>
      </div>
    </div>
  </form>
  
  <script>
    let profilePic = '';
    
    // Areas by city
    const areasByCity = {
      'Gaborone': ['Broadhurst', 'Extension 10', 'Gopane', 'Mogoditshane', 'Naledi', 'Phakalane', 'Segoditshane', 'Serala', 'Taung', 'The Mall', 'Tlokweng'],
      'Francistown': ['Boronyana', 'Mogoditshane', 'Tati Town'],
      'Maun': ['Maun East', 'Maun West', 'Sangwali'],
      'Serowe': ['Central', 'Mogapi', 'Perepare'],
      'Lobatse': ['B老ly', 'Mogoditshane'],
      'Selibe Phikwe': ['Central', 'Tswere'],
      'Palapye': ['Central', 'Mogoditshane'],
      'Molepolole': ['Central', 'Mogoditshane'],
      'Kanye': ['Central', 'Mogoditshane'],
      'Mogoditshane': ['Central', 'Phase 1', 'Phase 2']
    };
    
    function toggleAccordion(btn) {
      btn.classList.toggle('active');
      const panel = btn.nextElementSibling;
      panel.classList.toggle('open');
    }
    
    function handlePicUpload(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          profilePic = e.target.result;
          document.getElementById('profile-pic-display').innerHTML = '<img src="' + profilePic + '">';
        };
        reader.readAsDataURL(input.files[0]);
      }
    }
    
    function calculateAge() {
      const dob = document.getElementById('dob').value;
      if (dob) {
        const birthDate = new Date(dob);
        const today = new Date();
        let age = today.getFullYear() - birthDate.getFullYear();
        const monthDiff = today.getMonth() - birthDate.getMonth();
        if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
          age--;
        }
        document.getElementById('age-display').textContent = 'Age: ' + age;
      }
    }
    
    function loadAreas() {
      const city = document.getElementById('city').value;
      const areaSelect = document.getElementById('area');
      areaSelect.innerHTML = '<option value="">Area / Neighbourhood</option>';
      
      if (areasByCity[city]) {
        areasByCity[city].forEach(area => {
          areaSelect.innerHTML += '<option value="' + area + '">' + area + '</option>';
        });
      }
    }
    
    function nextPage() {
      // Validate page 1
      const firstname = document.getElementById('firstname').value;
      const surname = document.getElementById('surname').value;
      const dob = document.getElementById('dob').value;
      const gender = document.getElementById('gender').value;
      
      if (!firstname || !surname || !dob || !gender) {
        alert('Please fill in required fields');
        return;
      }
      
      document.getElementById('page1').classList.remove('active');
      document.getElementById('page2').classList.add('active');
    }
    
    function prevPage() {
      document.getElementById('page2').classList.remove('active');
      document.getElementById('page1').classList.add('active');
    }
    
    function handleSubmit(e) {
      e.preventDefault();
      
      // Validate page 2
      const mobile = document.getElementById('mobile').value;
      const city = document.getElementById('city').value;
      
      if (!mobile || !city) {
        alert('Please fill in required fields');
        return;
      }
      
      // Create profile
      const profile = {
        id: 'listener-' + Date.now(),
        type: 'listener',
        firstname: document.getElementById('firstname').value,
        secondname: document.getElementById('secondname').value,
        surname: document.getElementById('surname').value,
        dob: document.getElementById('dob').value,
        gender: document.getElementById('gender').value,
        race: document.getElementById('race').value,
        mobile: mobile,
        mobileBanking: document.getElementById('mobile-banking').value,
        whatsapp: document.getElementById('whatsapp').value,
        city: city,
        area: document.getElementById('area').value,
        profilePic: profilePic,
        email: '',
        password: ''
      };
      
      // Save to localStorage
      localStorage.setItem('yarona_profile', JSON.stringify(profile));
      localStorage.setItem('yarona_user', JSON.stringify({
        id: profile.id,
        type: profile.type,
        name: profile.firstname + ' ' + profile.surname
      }));
      
      // Redirect to app
      location.href = 'index.html';
    }
  </script>
</body>
</html>
