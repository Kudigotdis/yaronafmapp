<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yarona FM - Welcome</title>
  <style>
    :root {
      --brand-red: #C41E3A;
      --brand-black: #000000;
      --brand-white: #FFFFFF;
      --grey-light: #E5E5E5;
      --grey-dark: #666666;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--brand-white);
      color: var(--brand-black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Header */
    .header {
      background: var(--brand-white);
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid var(--grey-light);
    }
    
    .header img {
      height: 40px;
      max-width: 150px;
    }
    
    .tagline {
      font-size: 24px;
      font-weight: bold;
      color: var(--brand-red);
      margin-top: 10px;
    }
    
    /* Content */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 20px;
    }
    
    .welcome-text {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 40px;
      color: var(--brand-black);
    }
    
    /* Buttons */
    .btn {
      width: calc(100% - 40px);
      max-width: 300px;
      margin: 10px auto;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
    }
    
    .btn-primary {
      background: var(--brand-red);
      color: var(--brand-white);
    }
    
    .btn-primary:active {
      opacity: 0.8;
    }
    
    .btn-secondary {
      background: var(--brand-white);
      color: var(--brand-black);
      border: 2px solid var(--brand-black);
    }
    
    .btn-secondary:active {
      background: var(--grey-light);
    }
    
    .btn-preview {
      background: var(--grey-light);
      color: var(--brand-black);
    }
    
    /* Divider */
    .divider {
      margin: 30px 20px;
      text-align: center;
      color: var(--grey-dark);
      font-size: 14px;
    }
    
    /* Footer */
    .footer {
      padding: 20px;
      text-align: center;
      color: var(--grey-dark);
      font-size: 12px;
    }
    
    .footer a {
      color: var(--brand-red);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <img src="Assets/logo/yarona-logo.svg" alt="Yarona FM">
    <div class="tagline">Live The Music</div>
  </div>
  
  <!-- Content -->
  <div class="content">
    <div class="welcome-text">Welcome to Yarona FM</div>
    
    <button class="btn btn-primary" onclick="location.href='listener-profile.html'">
      Create Listener Profile
    </button>
    
    <button class="btn btn-primary" onclick="location.href='staff-profile.html'">
      Create Staff Profile
    </button>
    
    <div class="divider">- or -</div>
    
    <button class="btn btn-preview" onclick="location.href='preview.html'">
      Preview Profile
    </button>
  </div>
  
  <!-- Footer -->
  <div class="footer">
    Already have a profile? <a href="login.html">Login</a>
  </div>
</body>
</html>
