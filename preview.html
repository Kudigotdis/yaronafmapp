<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yarona FM - Preview</title>
  <style>
    :root {
      --brand-red: #C41E3A;
      --brand-black: #000000;
      --brand-white: #FFFFFF;
      --grey-light: #E5E5E5;
      --grey-dark: #666666;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--brand-white);
      color: var(--brand-black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Header */
    .header {
      background: var(--brand-white);
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid var(--grey-light);
    }
    
    .header img {
      height: 40px;
      max-width: 150px;
    }
    
    .tagline {
      font-size: 24px;
      font-weight: bold;
      color: var(--brand-red);
      margin-top: 10px;
    }
    
    /* Content */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 20px;
    }
    
    .title {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 30px;
    }
    
    .subtitle {
      font-size: 14px;
      color: var(--grey-dark);
      text-align: center;
      margin-bottom: 30px;
    }
    
    /* Buttons */
    .btn {
      width: calc(100% - 40px);
      max-width: 300px;
      margin: 10px auto;
      padding: 20px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
    }
    
    .btn-listener {
      background: var(--brand-red);
      color: var(--brand-white);
    }
    
    .btn-presenter {
      background: var(--brand-black);
      color: var(--brand-white);
    }
    
    .btn-admin {
      background: var(--grey-light);
      color: var(--brand-black);
    }
    
    .btn-back {
      background: var(--brand-white);
      color: var(--brand-black);
      border: 2px solid var(--brand-black);
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <img src="Assets/logo/yarona-logo.svg" alt="Yarona FM">
    <div class="tagline">Live The Music</div>
  </div>
  
  <!-- Content -->
  <div class="content">
    <div class="title">Preview Profile</div>
    <div class="subtitle">View the app from different user perspectives</div>
    
    <button class="btn btn-listener" onclick="previewAs('listener')">
      Preview Listener
    </button>
    
    <button class="btn btn-presenter" onclick="previewAs('presenter')">
      Preview Presenter
    </button>
    
    <button class="btn btn-admin" onclick="previewAs('admin')">
      Preview Admin
    </button>
    
    <button class="btn btn-back" onclick="location.href='onboarding.html'">
      Back
    </button>
  </div>
  
  <script>
    // Preview profiles data
    const previewProfiles = {
      listener: {
        id: 'preview-listener',
        type: 'listener',
        firstname: 'Demo',
        surname: 'Listener',
        email: 'demo@listener.com',
        location: 'Gaborone'
      },
      presenter: {
        id: 'preview-presenter',
        type: 'staff',
        role: 'presenter',
        firstname: 'Demo',
        surname: 'Presenter',
        email: 'demo@presenter.com',
        location: 'Gaborone'
      },
      admin: {
        id: 'preview-admin',
        type: 'staff',
        role: 'admin',
        firstname: 'Demo',
        surname: 'Admin',
        email: 'demo@admin.com',
        location: 'Gaborone'
      }
    };
    
    function previewAs(type) {
      // Set preview user
      localStorage.setItem('yarona_user', JSON.stringify(previewProfiles[type]));
      localStorage.setItem('yarona_preview', type);
      
      // Redirect to app
      location.href = 'index.html';
    }
  </script>
</body>
</html>
