<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="stylesheet" href="../style.css"/><title>S.O.S — Show</title>
<style>.wrap{padding:12px;max-width:760px;margin:0 auto}.tabs{display:flex;gap:8px;margin-top:12px}.tab{padding:8px;border-radius:6px;background:#fff;border:1px solid #eee;cursor:pointer}.active{background:#c00;color:#fff}</style>
</head>
<body>
<div class="wrap">
  <img src="../Assets/Shows/S_O_S.jpg" alt="S.O.S" style="width:100%;border-radius:8px;margin-bottom:8px"/>
  <h1>S.O.S</h1>
  <div class="tabs"><div class="tab active" data-tab="about">About</div><div class="tab" data-tab="content">Content</div></div>
  <div id="about" style="margin-top:12px">
    <p><strong>Hosts:</strong> <a href="../presenters/soso.html">Soso</a> • Saturday 10:00 – 14:00</p>
    <p>S.O.S is a Saturday show blending throwbacks and new tracks with lively listener banter.</p>
  </div>
  <div id="content" style="display:none;margin-top:12px"><p>Episodes and highlights (placeholder).</p></div>
</div>
<script>document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', e=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); e.target.classList.add('active'); const tab=e.target.dataset.tab; document.getElementById('about').style.display = tab==='about' ? 'block' : 'none'; document.getElementById('content').style.display = tab==='content' ? 'block' : 'none'; }));</script>
</body>
</html>
