<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <title>YAMAs — Yarona FM Music Awards</title>
  <style>
    /* Base Styles */
    :root {
      --bg-color: #000000;
      --text-color: #ffffff;
      --card-bg: #ffffff;
      --card-text: #000000;
      --accent: #888888;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Mobile App Dimensions Constraint */
    .wrap {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: 80px;
      min-height: 100vh;
      box-sizing: border-box;
      position: relative;
    }

    /* Views */
    .view {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .view.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Images */
    .hero-img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 16px;
      margin-bottom: 20px;
      background-color: #222;
      box-shadow: 0 4px 12px rgba(255,255,255,0.1);
    }

    /* Typography */
    h1 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    h3 {
      font-size: 18px;
      margin-bottom: 12px;
      color: #ccc;
    }
    p {
      line-height: 1.5;
      margin-bottom: 20px;
      color: #dddddd;
      font-size: 15px;
    }

    /* Stacked Buttons for Mobile */
    .btn-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
      padding-bottom: 40px;
    }
    
    .btn {
      background-color: var(--card-bg);
      color: var(--card-text);
      padding: 18px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      text-align: center;
      transition: transform 0.1s, background-color 0.2s;
      box-shadow: 0 2px 8px rgba(255,255,255,0.05);
      width: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active {
      transform: scale(0.98);
      background-color: #e0e0e0;
    }

    /* Tabs & Swipe Layout */
    .tabs-header {
      display: flex;
      border-bottom: 1px solid #333;
      margin-bottom: 16px;
    }
    .tab-link {
      flex: 1;
      text-align: center;
      padding: 14px 12px;
      cursor: pointer;
      color: var(--accent);
      font-weight: 600;
      font-size: 15px;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.2s, border-color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-link.active {
      color: #fff;
      border-color: #fff;
    }

    .swipe-wrapper {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE/Edge */
      padding-bottom: 20px;
    }
    .swipe-wrapper::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }
    .swipe-panel {
      flex: 0 0 100%;
      scroll-snap-align: start;
      padding-right: 1px; /* Prevents content clipping */
      box-sizing: border-box;
    }

    /* Accordions (Cards) */
    details {
      background-color: var(--card-bg);
      color: var(--card-text);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(255,255,255,0.05);
    }
    details[open] summary {
      margin-bottom: 12px;
      border-bottom: 1px solid #eee;
      padding-bottom: 12px;
    }
    summary {
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      outline: none;
      list-style: none;
      position: relative;
      padding-right: 20px;
      -webkit-tap-highlight-color: transparent;
    }
    summary::-webkit-details-marker {
      display: none;
    }
    summary::after {
      content: '+';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.4em;
      line-height: 1;
      color: #666;
      font-weight: 400;
    }
    details[open] summary::after {
      content: '−';
    }
    .accordion-content {
      font-size: 14px;
      line-height: 1.6;
    }
    .winner {
      font-weight: 700;
      color: #000;
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .winner::before {
      content: '🏆 Winner: ';
      color: #d32f2f;
    }
    .nominees {
      color: #555;
      display: block;
    }
    
    .hosts-list {
      background-color: #1a1a1a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      border: 1px solid #333;
    }
    .hosts-list p { 
      margin: 0; 
      font-weight: 600; 
      color: #fff; 
      font-size: 15px;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 480px;
      margin: 0 auto;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 12px 16px;
      box-sizing: border-box;
      z-index: 1000;
    }

    .bottom-bar .btn {
      background: var(--card-bg);
      color: var(--card-text);
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      transition: transform 0.1s;
    }

    .bottom-bar .btn:active {
      transform: scale(0.98);
    }

    .sponsor-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .sponsor-card {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .sponsor-card img {
      width: 100%;
      height: 80px;
      object-fit: contain;
      border-radius: 4px;
      background: #fff;
    }

    .sponsor-card .sponsor-name {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #333;
    }
  </style>
</head>
<body>

  <!-- VIEW: HOME -->
  <div id="home-view" class="wrap view active">
    <!-- Large Hero Image -->
    <img src="Assets/YAMAs/yamas_artwork.jpg" alt="Yarona FM Music Awards" class="hero-img" />
    
    <h1>YAMAs</h1>
    <p>The Yarona FM Music Awards (YAMAs) celebrate the best in urban music across Botswana. Launched to recognize local talent, the awards have become a cornerstone of the nation's music industry.</p>
    
    <div class="btn-stack" id="year-buttons">
      <!-- Buttons stacked vertically populated by JS -->
    </div>
  </div>

  <!-- VIEW: YEAR DETAIL -->

    <img id="y-image" src="" alt="Year Event" class="hero-img" />
    <h1 id="y-title">Year</h1>
    <p id="y-desc">Description</p>
    
    <div class="hosts-list">
      <p id="y-hosts">🎤 Hosts: </p>
    </div>

    <!-- Tabs Header -->
    <div class="tabs-header">
      <div id="tab-categories" class="tab-link active" onclick="scrollToTab(0)">Categories</div>
      <div id="tab-sponsors" class="tab-link" onclick="scrollToTab(1)">Sponsors</div>
    </div>

    <!-- Swipeable Area -->
    <div class="swipe-wrapper" id="swipe-wrapper">
      
      <!-- Panel 1: Categories -->
      <div class="swipe-panel">
        <div id="categories-container">
          <!-- Accordions populated by JS -->
        </div>
      </div>

      <!-- Panel 2: Sponsors -->
      <div class="swipe-panel">
        <div id="sponsors-container">
          <!-- Sponsor Accordions populated by JS -->
        </div>
      </div>

    </div>
  </div>

  <!-- FIXED BOTTOM BAR -->

    <button class="btn" id="bottom-back-btn" onclick="handleBack()">Back</button>
  </div>

    const years = Object.keys(yamasData);
    
    // --- INIT ---
    document.addEventListener("DOMContentLoaded", () => {
      const btnStack = document.getElementById("year-buttons");
      years.forEach(year => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.textContent = year;
        btn.onclick = () => showYear(year);
        btnStack.appendChild(btn);
      });

      // Swipe listener to update tab active state
      const swipeWrapper = document.getElementById("swipe-wrapper");
      swipeWrapper.addEventListener('scroll', () => {
        const scrollLeft = swipeWrapper.scrollLeft;
        const width = swipeWrapper.offsetWidth;
        const index = Math.round(scrollLeft / width);
        updateTabUI(index);
      });
    });

    // --- NAVIGATION ---
    function handleBack() {
      if (document.getElementById("year-view").classList.contains("active")) {
        showHome();
      } else {
        window.location.href = "index.html?view=view-station";
      }
    }

    function showHome() {
      document.getElementById("year-view").classList.remove("active");
      document.getElementById("home-view").classList.add("active");
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showYear(year) {
      const data = yamasData[year];
      if(!data) return;

      // Populate Data
      document.getElementById("y-title").textContent = data.title;
      document.getElementById("y-desc").textContent = data.description;
      document.getElementById("y-hosts").textContent = `🎤 Hosts: ${data.hosts.join(" & ")}`;
      document.getElementById("y-image").src = data.img;

      // Populate Categories
      const catContainer = document.getElementById("categories-container");
      catContainer.innerHTML = '';
      data.categories.forEach(cat => {
        const details = document.createElement("details");
        details.innerHTML = `
          <summary>${cat.name}</summary>
          <div class="accordion-content">
            <span class="winner">${cat.winner}</span>
            <span class="nominees"><strong>Nominees:</strong> ${cat.nominees}</span>
          </div>
        `;
        catContainer.appendChild(details);
      });

      // Populate Sponsors
      const sponsContainer = document.getElementById("sponsors-container");
      sponsContainer.innerHTML = '';
      const sDetails = document.createElement("details");
      sDetails.setAttribute("open", "true");
      const sponsorLogos = data.sponsors.map(s => `
        <div class="sponsor-card">
          <img src="Assets/YAMAs/sponsor_logo_dummy.svg" alt="${s}">
          <div class="sponsor-name">${s}</div>
        </div>
      `).join('');
      sDetails.innerHTML = `
        <summary>Official Sponsors</summary>
        <div class="accordion-content">
          <div class="sponsor-grid">${sponsorLogos}</div>
        </div>
      `;
      sponsContainer.appendChild(sDetails);

      // Reset Tabs
      scrollToTab(0);

      // Switch View
      document.getElementById("home-view").classList.remove("active");
      document.getElementById("year-view").classList.add("active");
      window.scrollTo({ top: 0 });
    }

    // --- TABS & SWIPE LOGIC ---
    function scrollToTab(index) {
      const swipeWrapper = document.getElementById("swipe-wrapper");
      const width = swipeWrapper.offsetWidth;
      swipeWrapper.scrollTo({ left: width * index, behavior: 'smooth' });
      updateTabUI(index);
    }

    function updateTabUI(index) {
      const tabCat = document.getElementById("tab-categories");
      const tabSpons = document.getElementById("tab-sponsors");
      
      if(index === 0) {
        tabCat.classList.add("active");
        tabSpons.classList.remove("active");
      } else {
        tabSpons.classList.add("active");
        tabCat.classList.remove("active");
      }
    }
  </script>
</body>
</html>
